# RTIE frontend nginx config.
# - Serves the Vite build at /
# - Reverse-proxies /v1/*, /v1/stream (SSE), and /health to the backend
#   container. The frontend uses relative URLs (see src/api/client.js).
# - SSE (/v1/stream) requires proxy buffering off and a long read timeout
#   so the stream isn't chunked into single-event flushes or cut at 60s.

upstream rtie_backend {
    server rtie-backend:8000;
}

server {
    listen 80;
    server_name _;

    # SPA: try the requested path, then fall back to index.html for client-side
    # routing (react-router-dom).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE endpoint. proxy_buffering off is the load-bearing setting — without
    # it nginx buffers the entire response and tokens never reach the browser.
    location = /v1/stream {
        proxy_pass http://rtie_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Non-streaming backend routes.
    location /v1/ {
        proxy_pass http://rtie_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://rtie_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Gzip static assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
