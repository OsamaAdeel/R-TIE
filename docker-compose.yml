# RTIE local-dev stack (v1, internal-Techlogix persona).
#
# Two logical stacks under the same compose project `rtie`:
#   - Data stack:  `redis` + `postgres` services.
#                  Containers: rtie-redis, rtie-postgres.
#                  Volumes:    rtie_redis_data, rtie_postgres_data (preserve existing data).
#                  Bring up with: `docker compose up -d redis postgres`.
#   - App stack:   `rtie-app-backend` + `rtie-app-frontend` services.
#                  Containers: rtie-app-backend, rtie-app-frontend.
#                  Bring up with: `docker compose up -d rtie-app-backend rtie-app-frontend`.
#                  (Or `docker compose up -d` for everything.)
#
# Data and app services use distinct names so the app can be torn down / rebuilt
# without touching the persistent data containers.
#
# Oracle is EXTERNAL: the backend reaches it via ORACLE_HOST/PORT/SID/USER
# /PASSWORD in .env.dev. Add no oracle service here.
#
# REDIS_HOST and POSTGRES_HOST are overridden in the backend `environment:`
# block below to point at the data containers' container_name values — that
# way .env.dev can keep `localhost` for the bare-metal `python run.py`
# workflow without breaking the compose deployment.

services:
  redis:
    image: redis/redis-stack:latest
    container_name: rtie-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI (optional, dev-only)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: rtie-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rtie}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Memory tables — applied once on first volume init via Postgres's
      # docker-entrypoint-initdb.d mechanism. Subsequent boots ignore it.
      # LangGraph checkpointer creates its own tables via checkpointer.setup()
      # on every backend startup (idempotent).
      - ./db/memory/create_memory_tables.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rtie-app-backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    container_name: rtie-app-backend
    env_file:
      - .env.dev
    environment:
      # Force inter-container hostnames regardless of what .env.dev says, so
      # the same .env.dev works for bare-metal dev (localhost) and compose.
      # These resolve via container_name DNS on the shared compose network.
      REDIS_HOST: rtie-redis
      REDIS_PORT: "6379"
      POSTGRES_HOST: rtie-postgres
      POSTGRES_PORT: "5432"
      # ENVIRONMENT controls which .env.{ENVIRONMENT} src/main.py loads
      # AFTER docker compose has injected env_file values. Setting it here
      # keeps the dotenv layer pointed at the same file we already loaded.
      ENVIRONMENT: dev
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      # ~30 min grace for the cold-start corpus indexer. Warm Redis volume
      # makes the second boot trivially fast.
      retries: 120
      start_period: 60s
    restart: unless-stopped

  rtie-app-frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    container_name: rtie-app-frontend
    ports:
      - "5173:80"
    depends_on:
      rtie-app-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Names map to existing host volumes `rtie_redis_data` and
  # `rtie_postgres_data` via the `rtie_` project-name prefix. Do NOT rename —
  # the data containers were created against these names and Postgres /
  # RediSearch state lives in them.
  redis_data:
  postgres_data:
