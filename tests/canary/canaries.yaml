# RTIE canary regression set (18 queries across 3 tiers).
#
# Source proposal: Toheed-approved canary expansion. The set was carved out of
# the existing test_live_stream.py (16 tests), the W34 canary runner (9 typed
# queries), and the Phase 4 canary set (a-h). 15 of 18 queries here are reused
# from those suites; 3 are new (C04, C17, plus a re-pinned variant in C16/C18).
#
# Tiering:
#   Tier 1 — must pass before any model swap (W34c phase 2+). Fast, broad.
#   Tier 2 — must pass before promoting #12 (data_query._generate_sql).
#            Concentrated DATA_QUERY surface; pinned SQL/SUM semantics.
#   Tier 3 — manual; needs local Oracle data state to be meaningful.
#
# Assertion kinds (see run_canaries.py for the dispatcher):
#   done_field_eq       — done.<path> == value         (dotted path supported)
#   done_field_in       — done.<path> in [...values]
#   done_field_neq      — done.<path> != value
#   done_field_present  — done.<path> exists and is non-empty
#   markdown_contains       — substring in collected markdown OR done.explanation.markdown
#   markdown_not_contains   — substring NOT in markdown
#   markdown_contains_any   — any-of substrings in markdown
#   summary_contains_any    — any-of substrings in done.summary
#   warnings_contain        — any item in done.warnings contains substring
#   warnings_not_contain    — no item in done.warnings contains substring
#   min_citations           — len(done.source_citations) >= value
#   sql_contains            — substring in done.sql (case-insensitive)
#   sql_not_contains        — substring NOT in done.sql (case-insensitive)
#   stage_emitted           — at least one `event: stage` with stage == value
#   stage_message_not_emitted — no `event: stage` whose message contains substring
#   meta_field_eq           — meta.<path> == value
#   meta_field_in           — meta.<path> in [...values]
#
# `expected` is a shorthand for three common meta/done assertions; the runner
# expands it into meta_field_eq + warnings/badge checks. Use `expected.query_type:
# {one_of: [...]}` for canaries with legitimate variability (e.g. BI promotion).

canaries:

  # ──────────────────────────────────────────────────────────────────────
  # Tier 1 — happy paths + highest-blast-radius routes
  # ──────────────────────────────────────────────────────────────────────

  - id: C01
    tier: 1
    query: "How does FN_LOAD_OPS_RISK_DATA work?"
    expected:
      query_type: COLUMN_LOGIC
      schema: OFSMDM
      # Badge stays UNVERIFIED, but for a NARROWER reason after W160. This is a
      # single-function "How does <Fn> work?" query, so W160 gives it the
      # FUNCTION_LOGIC retrieval profile (top_k=5, rerank skipped) — multi_source
      # drops ~35 -> ~10 and W108-TRUNCATED no longer fires (asserted below).
      # However FN_LOAD_OPS_RISK_DATA's body reads from a SOURCE TABLE named
      # ABL_OPS_RISK_DATA, which the explainer cites in prose ("inserts data
      # from ABL_OPS_RISK_DATA"); the ABL_ prefix is not in W57's table-prefix
      # filter, so it is mis-flagged GROUNDING-HIGH ("cited function ... not in
      # retrieved sources") and forces UNVERIFIED. That is a SEPARATE,
      # pre-existing W57 grounding issue (present identically on the pre-W160
      # baseline, just masked there behind W108-TRUNCATED), explicitly OUT OF
      # W160's retrieval-collapse scope — tracked as a follow-up. W160's win is
      # provable and pinned here: W108-TRUNCATED is gone. (W148 history: the
      # prompt fix removed an earlier fabricated gate; FN_LOAD_OPS_RISK_DATA's
      # REAL December gate — EXTRACT(MONTH ...) = 12 — is still surfaced.)
      badge: UNVERIFIED
    assertions:
      - kind: done_field_neq
        path: type
        value: function_not_found
      # W148 wording-drift update: the real December gate is still surfaced,
      # just no longer via the stale literal "This function runs in" phrase.
      # FN_LOAD_OPS_RISK_DATA genuinely runs only in month 12, so a correct
      # grounded answer must reference that gate.
      - kind: markdown_contains_any
        values: ["December", "month=12", "month = 12", "MONTH FROM"]
      - kind: warnings_not_contain
        value: UNGROUNDED_IDENTIFIERS
      - kind: warnings_not_contain
        value: PARTIAL_SOURCE
      # W160 INVARIANT: the single-function collapse must keep retrieval under
      # the W108 source-concat budget. A W108-TRUNCATED warning here means the
      # gate stopped firing and the wide column-writer profile leaked back in.
      - kind: warnings_not_contain
        value: W108-TRUNCATED
      - kind: min_citations
        value: 1
    protects: "Single-function COLUMN_LOGIC happy path with a REAL calendar gate — graph payload, citations intact, FN_LOAD_OPS_RISK_DATA's genuine December (month=12) gate surfaced. Post-W160 this query takes the single-function retrieval collapse (top_k=5, no rerank): multi_source ~35 -> ~10 and W108-TRUNCATED no longer fires (pinned). Badge remains UNVERIFIED via a SEPARATE pre-existing W57 issue — the ABL_-prefixed source table ABL_OPS_RISK_DATA is mis-flagged GROUNDING-HIGH (out of W160 scope; follow-up). Drops if the collapse regresses (W108-TRUNCATED returns) or the December gate stops surfacing. (W57's fabrication-catch path is exercised by C09 and C12.)"

  - id: C19
    tier: 1
    query: "how does FN_G_TEST_CSTM work"
    expected:
      # W160: the canonical over-retrieval case the fix targets. A single
      # named function classified COLUMN_LOGIC; without the collapse the
      # ~27-function retrieval tripped W108-TRUNCATED and forced UNVERIFIED
      # (941 citations, diagnosed read-only). The collapse gives it the
      # FUNCTION_LOGIC profile (top_k=5, rerank skipped) -> VERIFIED.
      query_type: COLUMN_LOGIC
      # No schema pin: the classifier routes schema=OFSMDM (default) but
      # FN_G_TEST_CSTM's body is owned by OFSERM; the resolved schema is not
      # what this canary protects. (Same convergent-route tolerance as C12.)
      badge: VERIFIED
    assertions:
      - kind: done_field_neq
        path: type
        value: function_not_found
      # The fix's core invariant: collapsed retrieval stays under the W108
      # source-concat budget, so no truncation downgrade.
      - kind: warnings_not_contain
        value: W108-TRUNCATED
      - kind: warnings_not_contain
        value: UNGROUNDED_IDENTIFIERS
      - kind: min_citations
        value: 1
    protects: "W160 single-function retrieval collapse. 'how does FN_G_TEST_CSTM work' is a single named function that classifies COLUMN_LOGIC; pre-W160 the wide column-writer profile pulled ~27 neighbours, tripped W108-TRUNCATED and forced UNVERIFIED. Drops if the single-function gate stops firing (collapse regressed) and the wide profile leaks back in."

  - id: C02
    tier: 1
    query: "Explain the function SOME_FAKE_FN_THAT_DOES_NOT_EXIST"
    expected:
      badge: DECLINED
    assertions:
      - kind: done_field_eq
        path: type
        value: function_not_found
      - kind: done_field_eq
        path: badge
        value: DECLINED
      - kind: markdown_contains
        value: SOME_FAKE_FN_THAT_DOES_NOT_EXIST
    protects: "Function-precheck short-circuit — guards against fabricated explanations for non-existent functions."

  - id: C03
    tier: 1
    query: "How is N_ANNUAL_GROSS_INCOME calculated?"
    expected:
      query_type: VARIABLE_TRACE
      schema: OFSMDM
      badge: VERIFIED
    assertions:
      - kind: markdown_not_contains
        value: "Not Found in Indexed Functions"
      - kind: warnings_not_contain
        value: UNGROUNDED_IDENTIFIERS
    protects: "Grounded VARIABLE_TRACE in OFSMDM — W45 detector + alias resolver + chain builder all green."

  - id: C05
    tier: 1
    query: "What is the total N_EOP_BAL for V_LV_CODE='ABL' on 2025-12-31?"
    expected:
      query_type: DATA_QUERY
      schema: OFSMDM
      badge: VERIFIED
    assertions:
      - kind: done_field_eq
        path: type
        value: data_query
      - kind: done_field_eq
        path: status
        value: answered
      - kind: summary_contains_any
        values:
          - "-24,179,237,139.63"
          - "-24179237139.63"
      - kind: done_field_eq
        path: row_count
        value: 1
      - kind: sql_contains
        value: V_LV_CODE
      - kind: sql_contains
        value: FIC_MIS_DATE
    protects: "DATA_QUERY known-SUM anchor (-24,179,237,139.63). Load-bearing for W34c #12 (_generate_sql model promotion)."
    notes: |
      Local OFSMDM data is single-LV ('ABL'), so the filtered SUM equals the
      no-filter SUM. C19 (no-filter shape) was dropped — C05 covers both shapes
      under current data state. Revisit if LV diversity is added.

  - id: C09
    tier: 1
    query: "How does CS_Deferred_Tax_Asset_Net_of_DTL_Calculation work?"
    expected:
      # Classifier picks COLUMN_LOGIC ("explain function X") or VARIABLE_TRACE
      # (sibling rule "how is X calculated") on this phrasing — both downstream
      # paths converge to the same logic_explainer route. BI promotion to
      # FUNCTION_LOGIC also possible if a BI literal happens to match.
      query_type:
        one_of: [COLUMN_LOGIC, VARIABLE_TRACE, FUNCTION_LOGIC]
      # Function-name queries don't pivot schema — Phase 3's cross-schema
      # vector search retrieves the OFSERM function from the OFSMDM-default
      # context. Schema pivot mechanism (Phase 4) is per-column / per-table.
      schema: OFSMDM
      # W148: badge intentionally NOT pinned. CS_Deferred_Tax has no real
      # calendar gate, so the dominant correct outcome is VERIFIED with no
      # December claim; on the rare residual run where the LLM still emits a
      # December gate, W57 correctly downgrades to UNVERIFIED. Both outcomes
      # are acceptable — what must NEVER happen is a fabricated gate badged
      # VERIFIED (asserted by forbid_markdown_when_field below).
    assertions:
      - kind: done_field_neq
        path: type
        value: function_not_found
      # W148 — replaces the stale `markdown_contains "This function runs in"`
      # assertion, which codified the pre-W148 fabrication (this function has
      # NO calendar gate, so any December claim is fabricated). The fix made
      # the generator stop emitting the gate in the common case; the residual
      # is rare and W57-caught. Invariant: a fabricated December gate must
      # never be silently rubber-stamped as VERIFIED.
      - kind: forbid_markdown_when_field
        markdown_value: "december"
        path: badge
        value: VERIFIED
    protects: "W148 — CS_Deferred_Tax_Asset_Net_of_DTL_Calculation has no real calendar gate; the generator must not fabricate a December execution condition and pass it VERIFIED. Rare residual fabrication is tolerated only because W57 downgrades it to UNVERIFIED. Also exercises OFSERM function retrieval via cross-schema vector search (Phase 3 exit criterion); schema stays OFSMDM-default."

  - id: C10
    # Moved to Tier 3 after the initial pinning run found the function not
    # present in `graph:OFSERM` on current local Redis state. The W49
    # partial-source path is unreachable when the function is missing
    # entirely — the function-precheck DECLINEs first with `function_not_found`.
    # See README §"Tier 3 manual procedure" for resolution options.
    tier: 3
    query: "How does ABL_Def_Pension_Fund_Asset_Net_DTL work?"
    expected:
      query_type: COLUMN_LOGIC
      badge: UNVERIFIED
    assertions:
      - kind: warnings_contain
        value: PARTIAL_SOURCE
      - kind: markdown_contains
        value: "## ABL_Def_Pension_Fund_Asset_Net_DTL — Source Not Currently Indexed"
      - kind: markdown_not_contains
        value: "What this function most likely does"
      - kind: markdown_not_contains
        value: "Step 1"
      - kind: markdown_not_contains
        value: "This function runs in"
      - kind: markdown_contains
        value: "db/modules"
      - kind: markdown_contains
        value: "parser-coverage report"
    protects: "W49 partial-source structured response — strictest assertion set in the suite."
    needs_local_data:
      - "ABL_DEF_PENSION_FUND_ASSET_NET_DTL must exist in graph:OFSERM as metadata-only (no source body) — i.e. function indexed but body not loaded into the OFSMDM-only vector store. Currently absent from Redis on local main."
      - "Resolution: (a) re-index the OFSERM pension file via `python cli.py index --force` if it still exists under db/modules/; or (b) re-pin C10 to a different function that is metadata-only-no-source on current Redis state. Decision deferred."

  - id: C13
    tier: 1
    query: "How is CAP943 calculated?"
    expected:
      query_type:
        one_of: [COLUMN_LOGIC, FUNCTION_LOGIC]
      schema: OFSERM
      # NOT pinned to a specific badge: C13 is genuinely flaky on the
      # generation side. Some runs produce a clean answer that goes
      # through the FUNCTION_LOGIC branch and lands as VERIFIED with
      # no warnings; other runs route through COLUMN_LOGIC and the
      # model fabricates citations to functions not in retrieved
      # sources, which W57 correctly catches as UNVERIFIED. Pinning
      # either badge produces a flaky canary. The query_type and
      # schema assertions plus the markdown-contains-CAP943 check
      # are stable; badge is left unpinned. (Was tentatively flipped
      # to UNVERIFIED in the W57 followup PR after one observation
      # of fabrication; reverted when a second run came back clean.)
    assertions:
      - kind: markdown_contains
        value: CAP943
      - kind: meta_field_eq
        path: schema
        value: OFSERM
    protects: "Phase 7 BI routing — CAP-code-shaped identifier resolves through literal index. Accepts COLUMN_LOGIC or FUNCTION_LOGIC (BI promotion path)."

  - id: C14
    tier: 1
    query: "Why does FCT_PRODUCT_EXPOSURES differ from STG_PRODUCT_PROCESSOR for account TF1528012748-T24-COLLBLG on 2025-12-31?"
    expected:
      query_type: UNSUPPORTED
      badge: DECLINED
    assertions:
      - kind: done_field_eq
        path: badge
        value: DECLINED
      - kind: stage_message_not_emitted
        value: "Generating SQL"
    protects: "UNSUPPORTED reconciliation classifier rule. Highest-leverage regression target for W34c #1 (orchestrator on smaller model)."

  - id: C15
    tier: 1
    query: "Which accounts are likely to fail next quarter?"
    expected:
      query_type: UNSUPPORTED
      badge: DECLINED
    assertions:
      - kind: done_field_eq
        path: badge
        value: DECLINED
    protects: "UNSUPPORTED forecasting/prediction backstop. Different classifier trigger phrase from C14."

  - id: C16
    tier: 1
    # Identifier deliberately has no underscore (bypasses
    # extract_function_candidates / function-precheck) AND matches the W45
    # detector regex `[A-Z]{2,}[0-9]{2,}[A-Z0-9]*` (≥2 letters then ≥2 digits).
    # The original FAKE_COLUMN_999 pin was intercepted by the precheck
    # because of the underscore. The first re-pin to FAKEXYZ bypassed the
    # precheck but didn't match the W45 regex (no digits after letters), so
    # the variable_tracer ran a grounded trace instead of firing W45.
    # FAKECOL999 satisfies both constraints.
    query: "How is FAKECOL999 calculated?"
    expected:
      # "How is X calculated?" routes to VARIABLE_TRACE per the classifier
      # prompt rule, same as C03 and C18.
      query_type: VARIABLE_TRACE
      badge: UNVERIFIED
    assertions:
      - kind: warnings_contain
        value: UNGROUNDED_IDENTIFIERS
      - kind: warnings_contain
        value: FAKECOL999
      - kind: markdown_contains
        value: "FAKECOL999 — Not Found in Indexed Functions"
      - kind: markdown_not_contains
        value: "This function runs in"
      - kind: markdown_contains
        value: "### Suggested next step"
      - kind: markdown_contains
        value: "manifest gap report"
    protects: "W45 truly-ungrounded path stays correct after Phase 4's multi-schema backstop. Identifier shape (no underscore) deliberately bypasses the function-precheck."

  - id: C18
    tier: 1
    query: "How is CAP999 calculated?"
    expected:
      # Classifier emits VARIABLE_TRACE for "how is X calculated?" per its
      # prompt rule (matches C03 and C16). CAP999 is not in the BI literal
      # index, so no FUNCTION_LOGIC promotion happens — VARIABLE_TRACE stays.
      query_type: VARIABLE_TRACE
      badge: UNVERIFIED
    assertions:
      - kind: warnings_contain
        value: UNGROUNDED_IDENTIFIERS
      - kind: markdown_not_contains
        value: "This function runs in"
    protects: "W45 BI-shape (3-digit CAP-code) ungrounded handling. Distinct from C16 — exercises business-identifier shape specifically."

  # ──────────────────────────────────────────────────────────────────────
  # Tier 2 — DATA_QUERY surface, pinned SQL semantics
  # ──────────────────────────────────────────────────────────────────────

  - id: C04
    tier: 2
    query: "What writes N_EOP_BAL?"
    expected:
      query_type: VARIABLE_TRACE
      schema: OFSMDM
      badge: VERIFIED
    assertions:
      - kind: markdown_contains
        value: FN_LOAD_OPS_RISK_DATA
      - kind: warnings_not_contain
        value: UNGROUNDED_IDENTIFIERS
      - kind: min_citations
        value: 1
    protects: "Known-writers VARIABLE_TRACE in OFSMDM. Drops if model regresses on writer enumeration."

  - id: C06
    tier: 2
    query: "How many accounts have F_EXPOSURE_ENABLED_IND='N' on 2025-12-31?"
    expected:
      query_type: DATA_QUERY
      schema: OFSMDM
      badge: VERIFIED
    assertions:
      - kind: done_field_eq
        path: type
        value: data_query
      - kind: done_field_eq
        path: status
        value: answered
      # COUNT(*) result set is one row, so done.row_count is always 1 for an
      # aggregate. The actual count value lives in done.summary — pin there
      # mirroring C05's anchor pattern. W33 expected count: 669.
      - kind: summary_contains_any
        values: ["669"]
      - kind: sql_contains
        value: RTRIM
      - kind: sql_contains
        value: F_EXPOSURE_ENABLED_IND
      - kind: stage_emitted
        value: generating_sql
      - kind: stage_emitted
        value: validating
      - kind: stage_emitted
        value: fetch
      - kind: stage_emitted
        value: explain
    protects: "W33 CHAR-padding fix (RTRIM in SQL) + W34a progressive stage events. Both regress silently on a wrong model."

  - id: C07
    tier: 2
    query: "what's the v_prod_code of 601013101-8604 on 2025-12-31?"
    # No `expected.badge`: the identifier_ambiguous response is a
    # CLARIFICATION shape (built by ambiguity.build_identifier_ambiguous_response)
    # that does not include a `badge` field — distinct from DECLINED. The
    # type/status assertions below pin the CLARIFICATION shape correctly.
    assertions:
      - kind: done_field_eq
        path: type
        value: identifier_ambiguous
      - kind: done_field_eq
        path: status
        value: identifier_ambiguous
      - kind: done_field_present
        path: message
      - kind: stage_message_not_emitted
        value: "Executing"
    protects: "W22 identifier-ambiguity short-circuit — must fire before any Oracle SELECT. CLARIFICATION shape, not DECLINED."

  - id: C11
    tier: 2
    query: "What is the total N_STD_ACCT_HEAD_AMT in FCT_STANDARD_ACCT_HEAD on 2025-12-31?"
    expected:
      query_type: DATA_QUERY
      schema: OFSERM
      badge: VERIFIED
    assertions:
      - kind: done_field_eq
        path: type
        value: data_query
      - kind: done_field_eq
        path: status
        value: answered
      - kind: meta_field_eq
        path: schema
        value: OFSERM
      - kind: sql_contains
        value: OFSERM.FCT_STANDARD_ACCT_HEAD
      - kind: sql_not_contains
        value: STG_STANDARD_ACCT_HEAD
    protects: "Phase 4 schema pivot — DATA_QUERY routes to OFSERM, schema-qualified SQL, no STG substitution."

  - id: C12
    tier: 2
    query: "What writes N_STD_ACCT_HEAD_AMT?"
    expected:
      # No schema pin: N_STD_ACCT_HEAD_AMT lives in graph:index for both
      # OFSMDM and OFSERM, so Phase 4's column-owner pivot is suppressed
      # ("Multi-schema columns keep the orchestrator's classification" per
      # docs/w35_phase4_summary.md).
      #
      # query_type is route-convergent here, NOT a single deterministic
      # label: the classifier emits VARIABLE_TRACE (~87%) or COLUMN_LOGIC
      # (~13%) for "What writes X?", and BOTH converge on the same
      # logic_explainer route — the generated answer, citations, badge and
      # GROUNDING-HIGH warnings are byte-identical regardless of the label
      # (measured 15/15 runs; the only field that flipped was this one).
      # Pinning the bare label made C12 flaky (~13% spurious fails) with no
      # change in what it actually protects. Same convergent-route ambiguity
      # C09 and C13 already handle. Accept either; do NOT re-pin to a single
      # value — the load-bearing assertions are badge + GROUNDING-HIGH below.
      query_type:
        one_of: [VARIABLE_TRACE, COLUMN_LOGIC]
      # W57 retroactive catch (was VERIFIED pre-W57): the model presents
      # 4 SEC_*_DATA_POP_* functions as a sequential chain even though
      # none of them are in functions_analyzed (semantic search returned
      # the *_THRESHOLD_* / MINORITY_INTEREST family instead). Plus
      # Line 24 cited 4×. Pre-W57 this stamped VERIFIED on a
      # fabricated chain; W57's chain-coherence + per-claim binding
      # checks correctly downgrade.
      badge: UNVERIFIED
    assertions:
      - kind: warnings_not_contain
        value: UNGROUNDED_IDENTIFIERS
      - kind: min_citations
        value: 1
      - kind: warnings_contain
        value: "GROUNDING-HIGH:"
    protects: "VARIABLE_TRACE for a multi-schema column stays grounded (citations present, no W45 fire). The Phase 4 single-owner pivot is correctly NOT firing here — that path is exercised by C11 (DATA_QUERY → OFSERM single-table pivot). W57 enforcement actively catches the chain-of-non-retrieved-functions fabrication via the HIGH-severity chain-coherence check; regression to badge=VERIFIED with no GROUNDING-HIGH: warning would mean fabricated step-chains can rubber-stamp again. query_type is route-convergent (VARIABLE_TRACE or COLUMN_LOGIC both reach the same logic_explainer) and is accepted as either — it is NOT the protected invariant, so it must not be re-pinned to a single value; the badge + GROUNDING-HIGH assertions are."

  # ──────────────────────────────────────────────────────────────────────
  # Tier 3 — manual; needs local Oracle data state
  # ──────────────────────────────────────────────────────────────────────

  - id: C08
    tier: 3
    query: "Why is N_EOP_BAL negative for account PK00108091TR00PKRGBP-T24-LIVEPOSG on 2025-12-31?"
    expected:
      badge: UNVERIFIED
    assertions:
      - kind: done_field_in
        path: type
        values: [phase2, value_trace]
      - kind: done_field_present
        path: origin
      - kind: done_field_present
        path: verification_sql
      - kind: markdown_not_contains
        value: "likely"
      - kind: markdown_not_contains
        value: "probably"
    protects: "Phase 2 explainer + origin classifier — W34c candidate #11 regression target."
    needs_local_data:
      - "Account PK00108091TR00PKRGBP-T24-LIVEPOSG must exist in OFSMDM staging on 2025-12-31."

  - id: C17
    tier: 3
    query: "Bank says N_EOP_BAL is 50000000 but system shows 100000000 for account TF1528012748-T24-COLLBLG on 2025-12-31"
    expected:
      query_type: DIFFERENCE_EXPLANATION
    assertions:
      - kind: done_field_in
        path: type
        values: [phase2, difference_explanation, value_trace]
    protects: "DIFFERENCE_EXPLANATION extraction (expected_value=50M, actual_value=100M) + phase2 reconciliation backstop."
    needs_local_data:
      - "Account TF1528012748-T24-COLLBLG must exist in OFSMDM staging on 2025-12-31."
      - "Bank/system values are synthetic — phase2 declines gracefully if no row matches."
